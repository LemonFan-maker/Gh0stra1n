<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>

    <!-- 背景：柔和淡粉米白 -->
    <linearGradient id="logo_bgRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF9"/>
      <stop offset="50%" stop-color="#F8F2F1"/>
      <stop offset="100%" stop-color="#EFE4E3"/>
    </linearGradient>

    <linearGradient id="logo_rimRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EBDCD9"/>
      <stop offset="100%" stop-color="#D6C4C1"/>
    </linearGradient>

    <!-- 下层只读基座：粉瓷白玉 -->
    <linearGradient id="logo_baseTopRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5ECEB"/>
    </linearGradient>
    <linearGradient id="logo_baseLeftRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE0DF"/>
      <stop offset="100%" stop-color="#DDCECD"/>
    </linearGradient>
    <linearGradient id="logo_baseRightRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2D4D3"/>
      <stop offset="100%" stop-color="#CEC0BF"/>
    </linearGradient>

    <!-- 上层悬浮修改块：柔和半透玫瑰粉晶 (半透明度 0.82) -->
    <linearGradient id="logo_uTopRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FECDD3" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FB7185" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="logo_uLeftRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.80"/>
    </linearGradient>
    <linearGradient id="logo_uRightRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#BE123C" stop-opacity="0.78"/>
    </linearGradient>

    <linearGradient id="logo_fluxRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="logo_shadowRoseBase" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#8C7A78" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#5C4846" flood-opacity="0.10"/>
    </filter>

    <filter id="logo_shadowRoseUpper" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#BE123C" flood-opacity="0.25"/>
    </filter>
  

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF9"/>
      <stop offset="50%" stop-color="#FFF6F7"/>
      <stop offset="100%" stop-color="#FDF1F2"/>
    </linearGradient>

    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FCE3E8"/>
      <stop offset="100%" stop-color="#F2CAD3"/>
    </linearGradient>

    <radialGradient id="softGlow" cx="15%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#80626B" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#543A43" flood-opacity="0.03"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <g filter="url(#cardShadow)">
    <rect x="8" y="8" width="1184" height="264" rx="24" fill="url(#cardGrad)" stroke="url(#cardStroke)" stroke-width="1.5"/>
  </g>
  <rect x="8" y="8" width="1184" height="264" rx="24" fill="url(#softGlow)" pointer-events="none"/>

  <!-- Left: Logo (180x180), y_center = 140, y = 50 -->
  <g id="app-logo" transform="translate(80, 50) scale(0.3515625)">
<rect x="20" y="20" width="472" height="472" rx="104" fill="url(#logo_bgRose)" stroke="url(#logo_rimRose)" stroke-width="2.5"/>

  <g opacity="0.32" stroke="#DAC6C3" stroke-width="1.2">
    <circle cx="256" cy="256" r="180" fill="none" stroke-dasharray="6,8"/>
    <line x1="80" y1="256" x2="432" y2="256" stroke-dasharray="4,6"/>
    <line x1="256" y1="80" x2="256" y2="432" stroke-dasharray="4,6"/>
  </g>

  <!-- 1. 下层只读基座 -->
  <g filter="url(#logo_shadowRoseBase)">
    <polygon points="256,244 372,302 256,360 140,302" fill="url(#logo_baseTopRose)" stroke="#DAC8C6" stroke-width="1.5"/>
    <polygon points="140,302 256,360 256,420 140,362" fill="url(#logo_baseLeftRose)" stroke="#CCB9B7" stroke-width="1.5"/>
    <polygon points="256,360 372,302 372,362 256,420" fill="url(#logo_baseRightRose)" stroke="#BFAA98" stroke-width="1.5"/>
    <g opacity="0.35" stroke="#9E8582" stroke-width="1.2">
      <line x1="198" y1="273" x2="314" y2="331"/>
      <line x1="227" y1="258" x2="343" y2="316"/>
    </g>
  </g>

  <!-- 2. 中间 OverlayFS 映射虚空层 -->
  <g>
    <polygon points="256,224 372,282 256,340 140,282" fill="url(#logo_fluxRose)" stroke="#FB7185" stroke-width="1.5" stroke-dasharray="8,6"/>
    <line x1="140" y1="302" x2="140" y2="198" stroke="#FB7185" stroke-width="2.2" stroke-dasharray="4,4" opacity="0.85"/>
    <line x1="372" y1="302" x2="372" y2="198" stroke="#FB7185" stroke-width="2.2" stroke-dasharray="4,4" opacity="0.85"/>
    <line x1="256" y1="360" x2="256" y2="256" stroke="#FB7185" stroke-width="2.2" stroke-dasharray="4,4" opacity="0.85"/>
    <line x1="256" y1="244" x2="256" y2="140" stroke="#FB7185" stroke-width="2.2" stroke-dasharray="4,4" opacity="0.85"/>
    <circle cx="140" cy="198" r="3" fill="#FB7185"/>
    <circle cx="372" cy="198" r="3" fill="#FB7185"/>
    <circle cx="256" cy="256" r="4" fill="#F43F5E"/>
    <circle cx="256" cy="140" r="3" fill="#F43F5E"/>
  </g>

  <!-- 3. 上层半透温润粉晶切片 -->
  <g filter="url(#logo_shadowRoseUpper)">
    <!-- 内部透光厚度 -->
    <polygon points="256,82 140,140 140,198 256,140" fill="#E11D48" opacity="0.15"/>
    <polygon points="256,82 372,140 372,198 256,140" fill="#BE123C" opacity="0.15"/>

    <polygon points="256,82 372,140 256,198 140,140" fill="url(#logo_uTopRose)" stroke="#FFE4E6" stroke-width="1.5" stroke-opacity="0.9"/>
    <polygon points="140,140 256,198 256,256 140,198" fill="url(#logo_uLeftRose)"/>
    <polygon points="256,198 372,140 372,198 256,256" fill="url(#logo_uRightRose)"/>

    <line x1="140" y1="140" x2="256" y2="198" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" opacity="0.95"/>
    <line x1="256" y1="198" x2="372" y2="140" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="256" y1="198" x2="256" y2="256" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>

    <g transform="translate(256, 140)" opacity="0.95">
      <polygon points="0,-16 20,-6 0,4 -20,-6" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <circle cx="0" cy="-6" r="3" fill="#FFFFFF"/>
    </g>
  </g>
  </g>

  <!-- Right: Title & Single Tagline -->
  <g transform="translate(300, 0)">
    <!-- Title -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#24141C">Gh0stra1n</text>

    <!-- Subtitle (Clean single sentence) -->
    <text x="2" y="178" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Noto Sans SC', 'Segoe UI', sans-serif" font-size="21" font-weight="400" fill="#6A4D59" letter-spacing="0.2">针对现代 Android 系统的无损 OverlayFS 分区接管工具</text>
  </g>
</svg>
